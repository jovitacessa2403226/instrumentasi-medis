
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ESP32 MAX30102</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #eef3f9;
      color: #172b45;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
      padding: 30px 20px;
      text-align: center;
    }

    h1 {
      color: #075985;
      font-size: 42px;
      margin: 0 0 25px;
    }

    .subtitle {
      font-size: 20px;
      margin: 0 0 25px;
      color: #172b45;
    }

    .status {
      width: 100%;
      max-width: 840px;
      margin: 0 auto 36px;
      padding: 17px;
      border-radius: 12px;
      background: #e2e5e9;
      color: #172b45;
      font-size: 20px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 25px;
      margin-bottom: 10px;
    }

    button {
      border: none;
      border-radius: 11px;
      padding: 17px 28px;
      font-size: 20px;
      color: white;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.85;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #connectBtn {
      background: #078aca;
    }

    #disconnectBtn {
      background: #e52323;
    }

    .sensor-container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    .sensor-card {
      background: white;
      width: 310px;
      min-height: 270px;
      padding: 35px 20px;
      border-radius: 18px;
      box-shadow: 0 7px 18px rgba(0, 0, 0, 0.08);
    }

    .sensor-card h2 {
      font-size: 30px;
      margin: 18px 0 42px;
      color: #172b45;
    }

    .value {
      color: #078aca;
      font-size: 44px;
      font-weight: bold;
      margin-bottom: 32px;
    }

    .unit {
      font-size: 20px;
      color: #172b45;
    }

    .footer {
      margin-top: 28px;
      color: #5e7897;
      font-size: 16px;
      line-height: 1.6;
    }

    @media (max-width: 650px) {
      .container {
        padding: 25px 14px;
      }

      h1 {
        font-size: 32px;
      }

      .subtitle {
        font-size: 18px;
      }

      .status {
        font-size: 16px;
        margin-bottom: 25px;
      }

      .buttons {
        gap: 12px;
      }

      button {
        font-size: 16px;
        padding: 14px 18px;
      }

      .sensor-card {
        width: 100%;
        max-width: 350px;
        min-height: 230px;
      }

      .sensor-card h2 {
        font-size: 25px;
        margin-bottom: 30px;
      }

      .value {
        font-size: 38px;
        margin-bottom: 24px;
      }

      .unit {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <h1>ESP32 MAX30102</h1>

    <p class="subtitle">JOVITA dan CHELSEA</p>

    <div id="status" class="status" role="status" aria-live="polite">
      Status: Belum terhubung
    </div>

    <div class="buttons">
      <button id="connectBtn" type="button">
        Hubungkan ESP32
      </button>

      <button id="disconnectBtn" type="button" disabled>
        Putuskan Koneksi
      </button>
    </div>

    <section class="sensor-container">

      <article class="sensor-card">
        <h2>Heart Rate</h2>

        <div id="bpm" class="value">--</div>

        <div class="unit">BPM (denyut/menit)</div>
      </article>

      <article class="sensor-card">
        <h2>Oksigen Darah</h2>

        <div id="spo2" class="value">--</div>

        <div class="unit">SpO₂ (%)</div>
      </article>

    </section>

    <p id="lastUpdate" class="footer">
      Data sensor merupakan estimasi untuk demonstrasi,
      bukan alat diagnosis medis.
    </p>

  </main>

  <script>
    // UUID harus sama dengan program ESP32
    const SERVICE_UUID =
      "4fafc201-1fb5-459e-8fcc-c5c9c331914b";

    const CHARACTERISTIC_UUID =
      "beb5483e-36e1-4688-b7f5-ea07361b26a1";

    const DEVICE_NAME = "ESP32_Sensor";

    const statusElement = document.getElementById("status");
    const connectBtn = document.getElementById("connectBtn");
    const disconnectBtn = document.getElementById("disconnectBtn");
    const bpmElement = document.getElementById("bpm");
    const spo2Element = document.getElementById("spo2");
    const lastUpdateElement = document.getElementById("lastUpdate");

    let bleDevice = null;
    let bleServer = null;
    let bleCharacteristic = null;

    function setStatus(message, background, color) {
      statusElement.textContent = "Status: " + message;
      statusElement.style.backgroundColor = background;
      statusElement.style.color = color;
    }

    function setConnected(connected) {
      connectBtn.disabled = connected;
      disconnectBtn.disabled = !connected;
    }

    function resetValues() {
      bpmElement.textContent = "--";
      spo2Element.textContent = "--";

      lastUpdateElement.textContent =
        "Data sensor merupakan estimasi untuk demonstrasi, bukan alat diagnosis medis.";
    }

    async function connectBluetooth() {
      if (!navigator.bluetooth) {
        setStatus(
          "Browser tidak mendukung Bluetooth",
          "#f8d7da",
          "#842029"
        );
        return;
      }

      try {
        connectBtn.disabled = true;

        setStatus(
          "Memilih perangkat...",
          "#fff3cd",
          "#856404"
        );

        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [
            { name: DEVICE_NAME }
          ],
          optionalServices: [SERVICE_UUID]
        });

        bleDevice.addEventListener(
          "gattserverdisconnected",
          onDisconnected
        );

        setStatus(
          "Menghubungkan ke ESP32...",
          "#fff3cd",
          "#856404"
        );

        bleServer = await bleDevice.gatt.connect();

        const service =
          await bleServer.getPrimaryService(SERVICE_UUID);

        bleCharacteristic =
          await service.getCharacteristic(CHARACTERISTIC_UUID);

        bleCharacteristic.addEventListener(
          "characteristicvaluechanged",
          handleSensorData
        );

        await bleCharacteristic.startNotifications();

        setStatus(
          "Terhubung ke " + DEVICE_NAME,
          "#d1e7dd",
          "#0f5132"
        );

        setConnected(true);

      } catch (error) {
        console.error("Bluetooth error:", error);

        setStatus(
          "Gagal terhubung. " + error.message,
          "#f8d7da",
          "#842029"
        );

        setConnected(false);
      }
    }

    function handleSensorData(event) {
      const dataView = event.target.value;
      const decoder = new TextDecoder("utf-8");
      const message = decoder.decode(dataView).trim();

      console.log("Data diterima dari ESP32:", message);

      // Format data ESP32 yang diharapkan: BPM,SpO2
      const values = message.split(",");

      if (values.length !== 2) {
        console.warn("Format data tidak sesuai:", message);
        return;
      }

      const bpm = Number(values[0].trim());
      const spo2 = Number(values[1].trim());

      if (
        !Number.isFinite(bpm) ||
        !Number.isFinite(spo2) ||
        bpm <= 0 ||
        spo2 <= 0
      ) {
        console.warn("Nilai sensor tidak valid:", message);
        return;
      }

      bpmElement.textContent = Math.round(bpm);
      spo2Element.textContent = Math.round(spo2);

      lastUpdateElement.textContent =
        "Data terakhir diterima: " +
        new Date().toLocaleTimeString("id-ID");
    }

    function onDisconnected() {
      bleServer = null;
      bleCharacteristic = null;

      setStatus(
        "Belum terhubung",
        "#e2e5e9",
        "#172b45"
      );

      setConnected(false);
      resetValues();
    }

    function disconnectBluetooth() {
      if (bleDevice && bleDevice.gatt.connected) {
        bleDevice.gatt.disconnect();
      } else {
        onDisconnected();
      }
    }

    connectBtn.addEventListener(
      "click",
      connectBluetooth
    );

    disconnectBtn.addEventListener(
      "click",
      disconnectBluetooth
    );

    if (!navigator.bluetooth) {
      setStatus(
        "Web Bluetooth tidak tersedia di browser ini",
        "#f8d7da",
        "#842029"
      );

      connectBtn.disabled = true;
    }
  </script>
</body>
</html>
```
